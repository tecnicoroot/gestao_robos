[project]
name = "gestao-robos"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "David Luis", email = "tecnicoroot@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "cryptography>=50.0.1",
    "flet>=1.0.1",
    "pymysql>=1.2.3",
    "sshtunnel>=0.4.0",
]

[project.scripts]
gestao-robos = "gestao_robos:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
    "types-pymysql>=1.2.0.20260923",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
strict = true
